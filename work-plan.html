.cols { column-count: 2; column-gap: 20px; }
@media (max-width: 900px) { .cols { column-count: 1; } }
.grp { break-inside: avoid-column; margin-bottom: 10px; }
.gh { background: var(--band); color: var(--band-fg); font-weight: 600; padding: 4px 10px; display: flex; gap: 8px; border-radius: 4px 4px 0 0;

.row.att { margin-left: 18px; }   /* open item attached under its job's day row */

  .public .row { grid-template-columns: 22px minmax(0, 1fr); }
  .row .src, .row .due { display: none; } }
.bx { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--band); }
.bx[disabled] { opacity: 1; }
.src { color: var(--src); font-size: 12px; padding-top: 1px; overflow-wrap: anywhere; }
.due { color: var(--muted); font-size: 12px; padding-top: 1px; font-variant-numeric: tabular-nums; }
.t { min-width: 0; overflow-wrap: anywhere; }
.j { font-weight: 600; }
.st { color: var(--muted); font-size: 12px; }
.done .t, .done .due { color: var(--done); text-decoration: line-through; }
.hrs { display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.hrs input { width: 48px; font: inherit; font-size: 12px; padding: 1px 3px; text-align: right; color: var(--fg);
  background: var(--input); border: 1px solid var(--rule); border-radius: 3px; }
.hrs input:focus-visible, .bx:focus-visible, .nb:focus-visible, textarea:focus-visible { outline: 2px solid var(--band); outline-offset: 1px; }
.hrs .rv { color: var(--warn); }
.hl { display: flex; flex-direction: column; align-items: flex-end; font-size: 10px; line-height: 1.1; letter-spacing: .02em; }
.hl > span { display: flex; gap: 2px; align-items: center; font-size: 12px; }

.hrs { align-items: flex-end; }
.nb { background: none; border: 0; color: var(--src); font: inherit; font-size: 12px; cursor: pointer; padding: 0 2px; }
.nwrap { grid-column: 4 / -1; }

.status { font-size: 12px; color: var(--page-ink); min-height: 1.2em; }
[hidden] { display: none !important; }   /* .tabs/.back set display, which beat the hidden attribute and showed root-relative tab links on the public page */

const openGroups = new Set();   // names of expanded groups; empty = all collapsed
function toggleGroup(h) {
  const n = h.dataset.g; openGroups.has(n) ? openGroups.delete(n) : openGroups.add(n); render();
  document.querySelector(`.gh[data-g="${CSS.escape(n)}"]`)?.focus();
}
document.addEventListener("click", (ev) => { const h = ev.target.closest(".gh[data-g]"); if (h) toggleGroup(h); });
document.addEventListener("keydown", (ev) => {
  const h = ev.target.closest && ev.target.closest(".gh[data-g]");
  if (h && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); toggleGroup(h); }
});

function eff(it) { const e = edits[it.id] || {}; return {
  done: e.done ?? it.done, h: e.h ?? it.h, rev: e.rev ?? it.rev, notes: e.notes ?? it.notes }; }

function render() {
  const pub = PLAN.public;
  document.getElementById("app").classList.toggle("public", pub);
  $("#back").hidden = PLAN.mode === "local";   // public copy and artifact link to the board; local has the tabs
  $("#back").href = PLAN.mode === "mirror" ? "https://ch1333ks.github.io/jv-board-k4x9/" : "./";
  $("#tabs").hidden = PLAN.mode !== "local";
  $("#title").textContent = "Weekly Work Plan — week of " + PLAN.week;
  const all = PLAN.groups.flatMap((g) => g.items);
  const done = all.filter((it) => eff(it).done).length;
  let sub = `${PLAN.range} | ${all.length} items, ${done} done | generated ${PLAN.generated}`;
  if (!pub) {
    const open = all.filter((it) => !eff(it).done);
    const mine = open.reduce((s, it) => s + (+eff(it).h || 0), 0);
    const rev = open.reduce((s, it) => s + (+eff(it).rev || 0), 0);
    sub += ` | <b>${dur(mine)}</b> to complete, <b>${dur(rev, 10)}</b> to review (JL/MB)`;
  }
  $("#sub").innerHTML = sub;
  if (pub) {
    $("#legend").hidden = true;
  } else {
    $("#legend").hidden = false;
    $("#legend").innerHTML = `<span><b>to complete</b> my estimated hands-on hours (my real pace at the 75th percentile, which is the buffer)</span>` +
      `<span><b class="rv">to review</b> estimated JL/MB review hours once it's done</span><span>day bands show open hours to complete vs <b>${PLAN.capacity} h</b> focused time</span>` +
      (LOCAL ? "<span>Ticks, hours and notes save to the workbook and the bid board</span>"
             : "<span>Copy of the bid board's Work Plan tab; make changes there</span>");
  }
  $("#cols").innerHTML = PLAN.groups.map((g) => {
    const open = g.items.filter((it) => !eff(it).done);
    const load = open.reduce((s, it) => s + (+eff(it).h || 0), 0);
    const over = g.day && PLAN.capacity && load > PLAN.capacity;
    const rload = open.reduce((s, it) => s + (+eff(it).rev || 0), 0);
    const loadTxt = pub ? "" : `<span class="load${over ? " over" : ""}">${dur(load)} to complete${g.day && PLAN.capacity ? " / " + PLAN.capacity + "h" : ""}` +
      `${rload ? ` · ${dur(rload, 10)} to review` : ""}</span>`;
    const isOpen = openGroups.has(g.name);   // every group starts collapsed (Jim 2026-10-29)
    return `<section class="grp${g.overdue ? " top" : ""}"><div class="gh${g.overdue ? " od" : ""}" role="button" tabindex="0" aria-expanded="${isOpen}" data-g="${esc(g.name)}">` +
      `<span class="car">${isOpen ? "▾" : "▸"}</span><span>${esc(g.name)} (${g.items.length})</span>${loadTxt}</div>` +
      (isOpen ? g.items.map((it) => rowHtml(it, pub)).join("") : "") + "</section>";
  }).join("");
}

function rowHtml(it, pub) {
  const e = eff(it);
  const dis = pub || !canWrite ? " disabled" : "";
  const head = `<input type="checkbox" class="bx" id="d-${it.id}" data-id="${it.id}"${e.done ? " checked" : ""}${dis} aria-label="Done: ${esc(it.job || it.item)}">` +
    `<span class="src">${esc(it.src)}</span><span class="due">${esc(it.due)}</span>` +
    `<span class="t">${it.job ? `<span class="j">${esc(it.job)}</span>${it.item ? ": " : ""}` : ""}${esc(it.item)} <span class="st">${esc(it.status)}</span></span>`;
  if (pub) return `<div class="row${e.done ? " done" : ""}${it.sub ? " att" : ""}">${head}</div>`;
  const hrs = canWrite
    ? `<span class="hrs"><label class="hl">to complete<span><input id="h-${it.id}" data-id="${it.id}" data-f="h" value="${dur(e.h, STEP.h)}" title="5m, 2h, 1h30m or 1.5 (hours); rounds to 5 min" aria-label="Estimated time to complete"></span></label>` +
      `<label class="hl rv">to review<span><input id="r-${it.id}" class="rv" data-id="${it.id}" data-f="rev" value="${dur(e.rev || 0, STEP.rev)}" title="10m, 30m, 1h; rounds to 10 min" aria-label="Estimated JL/MB review time"></span></label>` +
      `<button class="nb" data-note="${it.id}" aria-expanded="${openNotes.has(it.id)}">${e.notes ? "note" : "+ note"}</button></span>`
    : `<span class="hrs"><span class="hl">to complete<span>${dur(e.h, STEP.h)}</span></span><span class="hl rv">to review<span>${dur(e.rev || 0, STEP.rev)}</span></span></span>`;
  const note = openNotes.has(it.id) && canWrite
    ? `<div class="nwrap"><textarea id="n-${it.id}" data-id="${it.id}" data-f="notes" aria-label="Notes">${esc(e.notes)}</textarea></div>`
    : "";  // notes stay folded like the printed plan; the note button opens them
  return `<div class="row${e.done ? " done" : ""}${it.sub ? " att" : ""}">${head}${hrs}${note}</div>`;
}

const LOCAL = PLAN.mode === "local";
const keyOf = (id) => (PLAN.groups.flatMap((g) => g.items).find((it) => it.id === id) || {}).key;
async function save(id, patch) {
  edits[id] = { ...(edits[id] || {}), ...patch };
  render();
  if (LOCAL) {  // the local bid board server is the master: workbook, board and pages all follow it
    try {
      const r = await fetch("/plan/edit", { method: "POST", headers: { "Content-Type": "application/json", "X-Board": "1" },
        body: JSON.stringify({ key: keyOf(id), ...patch }) });
      const j = await r.json();
      $("#status").textContent = j.ok ? "Saved" + (j.workbook === "queued" ? " (workbook busy in Excel; it catches up on the next run)" : "") : "Couldn't save: " + j.error;
    } catch (err) { $("#status").textContent = "Couldn't reach the board server; the change was not saved."; }
    return;
  }
}

document.addEventListener("change", (ev) => {
  const el = ev.target; const id = el.dataset.id; if (!id || PLAN.public || !canWrite) return;
  if (el.classList.contains("bx")) return save(id, { done: el.checked });
  if (el.dataset.f === "h" || el.dataset.f === "rev") {
    const v = parseDur(el.value, STEP[el.dataset.f]);
    if (!Number.isFinite(v) || v < 0) { $("#status").textContent = "Use a time like 5m, 2h, 1h30m or 1.5"; render(); return; }
    return save(id, { [el.dataset.f]: Math.round(v * 10000) / 10000 });
  }
  if (el.dataset.f === "notes") return save(id, { notes: el.value });
});
document.addEventListener("click", (ev) => {
  const b = ev.target.closest(".nb"); if (!b) return;
  const id = b.dataset.note; openNotes.has(id) ? openNotes.delete(id) : openNotes.add(id); render();
  if (openNotes.has(id)) document.getElementById("n-" + id)?.focus();
});

if (LOCAL) canWrite = true;
render();
// Refresh once per browser session (Jim 2026-10-30): the local page asks the board server to refresh, the public copy
// bypasses the cache; the artifact copy is static and is left alone.
(function () {
  let seen = false;
  const key = PLAN.mode === "local" ? "bbLoaded" : "bbPub:" + location.pathname;
  try { seen = sessionStorage.getItem(key) === "1"; sessionStorage.setItem(key, "1"); } catch (_) {}
  if (seen) return;
  if (PLAN.mode === "local") {
    $("#status").textContent = "Refreshing the board…";
    fetch("/refresh", { method: "POST", headers: { "X-Board": "1" } }).then((r) => r.json())
      .then((j) => { if (j.ok) location.reload(); else $("#status").textContent = ""; })
      .catch(() => { $("#status").textContent = ""; });
  } else if (PLAN.mode === "public") {
    location.replace(location.pathname + "?r=" + Date.now() + location.hash);
  }
})();
</script>
</body></html>
